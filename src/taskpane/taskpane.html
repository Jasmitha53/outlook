<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Description Saver</title>
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css" />
</head>

<body>
  <div class="container">

    <!-- Login view -->
    <section id="login-view" class="view">
      <div class="header">
        <h1>Job Description Saver</h1>
        <p>Sign in with your Codeplix account</p>
      </div>

      <div class="card">
        <div class="field">
          <label for="loginEmail">Email</label>
          <input
            id="loginEmail"
            type="email"
            autocomplete="username"
            placeholder="Enter your email"
          />
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
          />
        </div>

        <button id="loginButton" type="button">Login</button>
        <div id="loginMessage" class="message" role="status" aria-live="polite"></div>
      </div>
    </section>

    <!-- Job Description Saver view (shown after login) -->
    <section id="form-view" class="view" hidden>
      <div class="header header-row">
        <div>
          <h1>Job Description Saver</h1>
          <p id="signedInAs" class="signed-in"></p>
        </div>
        <button id="logoutButton" type="button" class="btn-secondary btn-small">Logout</button>
      </div>
      <hr class="divider" />

      <div class="card">
        <div class="field">
          <label for="emailSubject">Email Subject</label>
          <input id="emailSubject" type="text" readonly />
        </div>

        <div class="field">
          <label for="openingTitle">Title <span class="required">*</span></label>
          <input id="openingTitle" type="text" placeholder="Opening title" />
        </div>

        <div class="field">
          <label for="clientSelect">Client <span class="required">*</span></label>
          <select id="clientSelect">
            <option value="">Select client</option>
          </select>
        </div>

        <div class="field">
          <label for="contactSelect">Contact</label>
          <select id="contactSelect" disabled>
            <option value="">Select contact (optional)</option>
          </select>
        </div>

        <div class="field">
          <label for="recruiterSelect">Recruiters <span class="required">*</span></label>
          <select id="recruiterSelect" multiple size="4">
          </select>
          <p class="hint">Hold Ctrl (Windows) to select multiple.</p>
        </div>

        <div class="field">
          <label for="skillsSelect">Skills</label>
          <select id="skillsSelect" multiple size="4">
          </select>
          <p class="hint">Optional. Hold Ctrl to select multiple.</p>
        </div>

        <div class="field">
          <label for="jobDescription">Job Description <span class="required">*</span></label>
          <textarea
            id="jobDescription"
            placeholder="Paste the job description from the email here..."
          ></textarea>
        </div>

        <button id="submitButton" type="button">Submit</button>
        <div id="formMessage" class="message" role="status" aria-live="polite"></div>
      </div>
    </section>

  </div>
</body>
</html>
